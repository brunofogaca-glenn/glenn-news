name: Process reader history nightly

on:
  push:
    branches: [main]
    paths:
      - ".github/run-reader-history-migration"
  # Vercel Cron owns automatic processing. GitHub Actions is manual recovery only.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# The ledger and profile snapshot are shared mutable state; retries must not overlap.
concurrency:
  group: process-reader-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-reader-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check nightly window or explicit one-time migration trigger
        id: nightly_window
        shell: bash
        run: |
          allowed=false
          # Only the restricted migration-marker push may override the normal window.
          # Scheduled and manually dispatched recovery runs must stay inside the window.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            allowed=true
          else
            hour="$(TZ=Europe/Stockholm date +%H)"
            hour_num=$((10#$hour))
            if (( hour_num >= 1 && hour_num < 6 )); then
              allowed=true
            else
              echo "::error::Reader-history scheduled/manual run started outside 01:00â€“05:59 Europe/Stockholm. Failing visibly instead of reporting a successful skip."
              exit 1
            fi
          fi

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

