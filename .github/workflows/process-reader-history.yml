name: Process reader history nightly

on:
  push:
    branches: [main]
    paths:
      - ".github/run-reader-history-migration"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# The ledger and profile snapshot are shared mutable state; retries must not overlap.
concurrency:
  group: process-reader-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-reader-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check nightly window or explicit one-time migration trigger
        id: nightly_window
        shell: bash
        run: |
          allowed=false
          # Only the restricted migration-marker push may override the normal window.
          # Scheduled and manually dispatched recovery runs must stay inside the window.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            allowed=true
          else
            hour="$(TZ=Europe/Stockholm date +%H)"
            hour_num=$((10#$hour))
            if (( hour_num >= 1 && hour_num < 6 )); then
              allowed=true
            else
              echo "::error::Reader-history manual recovery started outside 01:00–05:59 Europe/Stockholm. Failing visibly instead of reporting a successful skip."
              exit 1
            fi
          fi

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Process reading batches and cache profile before the morning edition
        if: steps.nightly_window.outputs.allowed == 'true'
        env:
          REFRESH_URL: https://glenn-news.vercel.app/api/cron/process-reader-history
          OIDC_AUDIENCE: https://glenn-news.vercel.app
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions did not provide OIDC credentials. Ensure id-token: write is enabled."
            exit 1
          fi
          if [[ -z "$VERCEL_BYPASS_SECRET" ]]; then
            echo "::error::Add VERCEL_AUTOMATION_BYPASS_SECRET to GitHub Actions secrets."
            exit 1
          fi

          oidc_response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            --get \
            --data-urlencode "audience=$OIDC_AUDIENCE" \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          oidc_token="$(printf '%s' "$oidc_response" | jq -er '.value')"

          request_url="$REFRESH_URL"
          # The workflow only receives this push when the one-time migration marker changes.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            request_url="${REFRESH_URL}?manual=1"
          fi

          response="$(curl --fail-with-body --silent --show-error --max-time 270 \
            --header "Authorization: Bearer $oidc_token" \
            --header "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET" \
            --header "Accept: application/json" \
            "$request_url")"

          # The endpoint can skip if the time window closes between the workflow guard and API call.
          # Treat a skipped/non-processing response as a visible failure, not a green run.
          printf '%s\n' "$response" | jq -e '
            .ok == true and .skipped != true and
            (.snapshotUpdated == true or .snapshotSkipped == true)
          ' >/dev/null
          printf '%s\n' "$response" | jq '{
            ok, snapshotUpdated, snapshotSkipped, snapshotGeneratedAt,
            ledgerChanged, ledgerUpdatedAt, scannedBatches, updatedBatches
          }'
