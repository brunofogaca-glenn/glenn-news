name: Refresh Fotbollskanalen articles

on:
  schedule:
    # GitHub schedules can be substantially delayed. Retry at several points
    # within the overnight window; an authenticated preflight avoids duplicate
    # scrapes and Blob writes after the first successful ingestion.
    - cron: "17 0,1,2,3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Prevent overlapping browser scrapes and let the pending run preflight the
# snapshot after the running job finishes.
concurrency:
  group: refresh-fotbollskanalen-articles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-fotbollskanalen-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check nightly maintenance window
        id: nightly_window
        shell: bash
        run: |
          hour="$(TZ=Europe/Stockholm date +%H)"
          hour_num=$((10#$hour))
          if (( hour_num >= 1 && hour_num < 6 )); then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Scheduled browser refresh started outside 01:00–05:59 Europe/Stockholm. Failing visibly instead of reporting a successful skip."
            exit 1
          fi

      - name: Check whether today's snapshot already exists
        id: snapshot_check
        if: steps.nightly_window.outputs.allowed == 'true'
        env:
          STATUS_URL: https://glenn-news.vercel.app/api/cron/ingest-fotbollskanalen-articles
          OIDC_AUDIENCE: https://glenn-news.vercel.app
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions did not provide OIDC credentials. Ensure id-token: write is enabled."
            exit 1
          fi
          if [[ -z "$VERCEL_BYPASS_SECRET" ]]; then
            echo "::error::Add VERCEL_AUTOMATION_BYPASS_SECRET to GitHub Actions secrets."
            exit 1
          fi

          oidc_response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            --get --data-urlencode "audience=$OIDC_AUDIENCE" \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          oidc_token="$(printf '%s' "$oidc_response" | jq -er '.value')"

          status="$(curl --fail-with-body --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $oidc_token" \
            --header "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET" \
            --header "Accept: application/json" \
            "$STATUS_URL")"
          printf '%s\n' "$status" | jq '{ok, shouldRefresh, snapshotSavedAt, articleCount, newestArticleAt, latestArticleAgeHours, localTime}'
          should_refresh="$(printf '%s' "$status" | jq -er '.shouldRefresh')"
          echo "should_refresh=$should_refresh" >> "$GITHUB_OUTPUT"
          if [[ "$should_refresh" != "true" ]]; then
            echo "Today's Fotbollskanalen snapshot is already stored; skipping browser install, scrape and Blob write."
          fi

      - name: Check out repository
        if: steps.nightly_window.outputs.allowed == 'true' && steps.snapshot_check.outputs.should_refresh == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.nightly_window.outputs.allowed == 'true' && steps.snapshot_check.outputs.should_refresh == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Playwright Chromium
        if: steps.nightly_window.outputs.allowed == 'true' && steps.snapshot_check.outputs.should_refresh == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-playwright-1.56.0-chromium

      - name: Install Playwright
        if: steps.nightly_window.outputs.allowed == 'true' && steps.snapshot_check.outputs.should_refresh == 'true'
        run: npm install --no-save --package-lock=false playwright@1.56.0

      - name: Install browser
        if: steps.nightly_window.outputs.allowed == 'true' && steps.snapshot_check.outputs.should_refresh == 'true'
        run: npx playwright install --with-deps chromium

      - name: Read Fotbollskanalen through a real browser
        if: steps.nightly_window.outputs.allowed == 'true' && steps.snapshot_check.outputs.should_refresh == 'true'
        run: node scripts/scrape-fotbollskanalen-articles.mjs

      - name: Upload validated articles to Glenn News
        if: steps.nightly_window.outputs.allowed == 'true' && steps.snapshot_check.outputs.should_refresh == 'true'
        env:
          INGEST_URL: https://glenn-news.vercel.app/api/cron/ingest-fotbollskanalen-articles
          OIDC_AUDIENCE: https://glenn-news.vercel.app
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions did not provide OIDC credentials. Ensure id-token: write is enabled."
            exit 1
          fi
          if [[ -z "$VERCEL_BYPASS_SECRET" ]]; then
            echo "::error::Add VERCEL_AUTOMATION_BYPASS_SECRET to GitHub Actions secrets."
            exit 1
          fi

          oidc_response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            --get --data-urlencode "audience=$OIDC_AUDIENCE" \
            --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          oidc_token="$(printf '%s' "$oidc_response" | jq -er '.value')"

          curl --fail-with-body --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $oidc_token" \
            --header "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data-binary @fotbollskanalen-articles.json "$INGEST_URL"
