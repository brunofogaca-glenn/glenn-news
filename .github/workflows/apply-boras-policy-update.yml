name: Apply one-time Boras policy update

on:
  push:
    branches:
      - feature/boras-long-lived-event-catalog

permissions:
  contents: write

concurrency:
  group: apply-boras-policy-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply tested policy update and remove transfer files
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s .boras-transfer/implementation.patch.gz
          gzip -dc .boras-transfer/implementation.patch.gz > /tmp/boras-increment.patch
          git apply --check /tmp/boras-increment.patch
          git apply --index /tmp/boras-increment.patch
          rm -f .boras-transfer/implementation.patch.gz
          rm -f .github/workflows/apply-boras-policy-update.yml
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "fix: track Boras event cancellations and repeated unlisting"
          git push origin "HEAD:${HEAD_BRANCH}"
