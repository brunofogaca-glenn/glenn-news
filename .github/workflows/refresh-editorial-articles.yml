name: Refresh editorial articles

on:
  schedule:
    # Runs independently from supplemental data, starting at 06:03 Stockholm time.
    - cron: "3,33 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-editorial-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh editorial article cache
        env:
          REFRESH_URL: ${{ vars.GLENN_NEWS_ARTICLE_REFRESH_URL }}
          REFRESH_SECRET: ${{ secrets.GITHUB_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$REFRESH_URL" || -z "$REFRESH_SECRET" ]]; then
            echo "::error::Configure repository variable GLENN_NEWS_ARTICLE_REFRESH_URL and secret GITHUB_CRON_SECRET."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 240 \
            --header "Authorization: Bearer $REFRESH_SECRET" \
            --header "Accept: application/json" \
            "$REFRESH_URL"
