name: Create issues for failed production workflows

on:
  workflow_run:
    workflows:
      - "Glenn News validation"
      - "Process reader history nightly"
      - "Refresh Borås events"
      - "Refresh editorial articles"
      - "Refresh Fotbollskanalen articles"
      - "Refresh supplemental data"
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  report-failure:
    # Do not turn failed pull-request previews into production incidents.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create or update a deduplicated GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          set -euo pipefail

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"
          failed_jobs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "failure") | .name] | unique')"

          # Some workflow-level failures may not expose a failed job.
          if [[ -z "$failed_jobs_json" || "$failed_jobs_json" == "[]" ]]; then
            failed_jobs_json='["Workflow-level failure"]'
          fi

          while IFS= read -r job_name; do
            title="[Automated failure] ${SOURCE_WORKFLOW} — ${job_name}"
            body="$(cat <<EOF
          ## Automated workflow failure

          A GitHub Actions run on `main` failed. This issue is deduplicated by workflow and failed job; later failures append a comment while the issue remains open.

          - **Workflow:** ${SOURCE_WORKFLOW}
          - **Failed job:** ${job_name}
          - **Run:** [#${SOURCE_RUN_NUMBER}](${run_url})
          - **Trigger:** ${SOURCE_EVENT}
          - **Branch:** ${SOURCE_BRANCH}
          - **Commit:** `${SOURCE_SHA}`

          Open the linked run for the authoritative logs. Raw log excerpts, tokens, environment variables and request payloads are intentionally not copied into issues.
          EOF
          )"

            existing_number="$(gh issue list --state open --limit 1000 --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)"
            if [[ -n "$existing_number" ]]; then
              gh issue comment "$existing_number" --body "$body"
              echo "Updated existing issue #${existing_number} for ${SOURCE_WORKFLOW} / ${job_name}"
            else
              gh issue create --title "$title" --body "$body"
              echo "Created issue for ${SOURCE_WORKFLOW} / ${job_name}"
            fi
          done < <(jq -r '.[]' <<< "$failed_jobs_json")
