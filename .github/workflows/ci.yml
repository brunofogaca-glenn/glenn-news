name: Glenn News validation

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vercel owns Next.js compilation. GitHub Actions runs regression tests,
      # avoiding a second full Next.js build for the same commit.
      - name: Run regression tests
        run: npm run test:ranker && npm run test:refresh
